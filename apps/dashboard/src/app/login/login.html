<div class="min-h-screen bg-bg-base flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><rect width="20" height="12" x="2" y="9" rx="2"/><path d="M11 13v4"/><path d="M15 13v4"/><path d="M7 13v4"/><path d="M2 9l10-5 10 5"/></svg>
    </div>
    <h2 class="mt-6 text-center text-3xl font-display font-bold text-text-primary">
      Connectez-vous à votre compte
    </h2>
    <p class="mt-2 text-center text-sm text-text-secondary">
      Ou
      <a routerLink="/register" class="font-medium text-primary hover:text-primary-dark transition-colors">
        créez un nouveau compte en 5 minutes
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-card sm:rounded-lg sm:px-10 border border-border">
      <form class="space-y-6" (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div *ngIf="error" class="bg-danger/10 border border-danger text-danger px-4 py-3 rounded-md text-sm">
          {{ error }}
        </div>
        <div *ngIf="success" class="bg-success/10 border border-success text-success px-4 py-3 rounded-md text-sm">
          {{ success }}
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-text-secondary">
            Adresse e-mail
          </label>
          <div class="mt-1">
            <input id="email" name="email" type="email" required [(ngModel)]="loginData.email"
              class="appearance-none block w-full px-3 py-2 border border-border rounded-sm shadow-sm placeholder-text-secondary focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-text-secondary">
            Mot de passe
          </label>
          <div class="mt-1">
            <input id="password" name="password" type="password" required [(ngModel)]="loginData.password"
              class="appearance-none block w-full px-3 py-2 border border-border rounded-sm shadow-sm placeholder-text-secondary focus:outline-none focus:ring-primary focus:border-primary sm:text-sm">
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox"
              class="h-4 w-4 text-primary focus:ring-primary border-border rounded-sm">
            <label for="remember-me" class="ml-2 block text-sm text-text-secondary">
              Se souvenir de moi
            </label>
          </div>

          <div class="text-sm">
            <a href="#" class="font-medium text-primary hover:text-primary-dark transition-colors">
              Mot de passe oublié ?
            </a>
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="loading || !loginForm.valid"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50 transition-all">
            <span *ngIf="!loading">Se connecter</span>
            <span *ngIf="loading">Connexion...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
